[package]
name = "henlocal-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hlp-core.workspace = true
hlp-media.workspace = true
hlp-models.workspace = true
hlp-pipeline.workspace = true
anyhow.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater = "2.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
dirs.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSColor", "NSColorSpace", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
