[workspace]
resolver = "2"
members = ["crates/*", "app"]
exclude = ["vendor/qwen3-asr-mlx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
debug = 0
incremental = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "5"
sys-locale = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
unicode-width = "0.2"
unicode-segmentation = "1"
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
whatlang = "0.16"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"
zip = { version = "4", default-features = false, features = ["deflate"] }
sherpa-onnx = "=2.0.3"
proptest = "1"
tempfile = "3"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
regex = "1"
futures-util = "0.3"
fs2 = "0.4"
tokenizers = "0.21"
libc = "0.2"
mime_guess = "2"
hlp-core = { path = "crates/hlp-core" }
hlp-models = { path = "crates/hlp-models" }
hlp-media = { path = "crates/hlp-media" }
hlp-pipeline = { path = "crates/hlp-pipeline" }
hlp-asr-worker = { path = "crates/hlp-asr-worker" }
hlp-cli = { path = "crates/hlp-cli" }
