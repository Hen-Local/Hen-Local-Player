name: Checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-2022' && 'C:\hlp-target' || '/tmp/hlp-target' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p hlp-core -p hlp-media -p hlp-models --all-targets
      - run: cargo test --locked -p hlp-core -p hlp-media -p hlp-models
      - run: npm --prefix app/ui ci
      - run: npm --prefix app/ui run check
